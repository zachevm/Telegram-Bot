name: Memecoin Alerts

on:
  repository_dispatch:
  workflow_dispatch:

concurrency:
  group: memecoin-alerts
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install telethon requests urllib3

      - name: Run Alert Script
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
          TELEGRAM_CHAT_IDS: ${{ secrets.TELEGRAM_CHAT_IDS }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_USER_CHAT_ID: ${{ secrets.TELEGRAM_USER_CHAT_ID }}
          TELEGRAM_GROUP_ID: ${{ secrets.TELEGRAM_GROUP_ID }}

        run: python main.py
      - name: Save seen.json state
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add seen.json
          git diff --staged --quiet || (git commit -m "Auto-update seen.json" && git pull --rebase && git push)il 'github-actions[bot]@users.noreply.github.com'
          git add seen.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update seen.json" && git push)
